    (() =&gt; {
      const root = document.getElementById(&quot;eo-content-detail&quot;);
      const externalToggle = root.querySelector(&quot;#external-toggle&quot;);
      const externalLabel = root.querySelector('label[for=&quot;external-toggle&quot;]');
      const tabs = [...root.querySelectorAll(&quot;[data-platform]&quot;)];
      const rangeButtons = [...root.querySelectorAll(&quot;[data-range]&quot;)];
      const platformRows = [...root.querySelectorAll(&quot;[data-row-platform]&quot;)];
      const totalViews = root.querySelector(&quot;#total-views&quot;);
      const ownedViews = root.querySelector(&quot;#owned-views&quot;);
      const ownedShare = root.querySelector(&quot;#owned-share&quot;);
      const externalViews = root.querySelector(&quot;#external-views&quot;);
      const externalShare = root.querySelector(&quot;#external-share&quot;);
      const chartSubtitle = root.querySelector(&quot;#chart-subtitle&quot;);
      const chartGrid = root.querySelector(&quot;#chart-grid&quot;);
      const chartMilestones = root.querySelector(&quot;#chart-milestones&quot;);
      const chartArea = root.querySelector(&quot;#chart-area&quot;);
      const chartLine = root.querySelector(&quot;#chart-line&quot;);
      const chartPoints = root.querySelector(&quot;#chart-points&quot;);
      const chartLabels = root.querySelector(&quot;#chart-labels&quot;);

      const data = {
        all: { total: 1240000, owned: 1102000, external: 138000, share: &quot;89%&quot; },
        youtube: { total: 843000, owned: 761000, external: 82000, share: &quot;90%&quot; },
        magazine: { total: 87000, owned: 87000, external: 0, share: &quot;100%&quot; },
        instagram: { total: 260000, owned: 214000, external: 46000, share: &quot;82%&quot; },
        x: { total: 50000, owned: 40000, external: 10000, share: &quot;80%&quot; }
      };

      let selectedPlatform = &quot;all&quot;;
      let selectedRange = 30;
      let externalIncluded = true;

      const formatMetric = value =&gt; {
        if (value &gt;= 1000000) return `${(value / 1000000).toFixed(2).replace(/0$/, &quot;&quot;)}M`;
        if (value &gt;= 1000) return `${Math.round(value / 1000)}K`;
        return String(value);
      };

      const makeSeries = (days, total) =&gt; {
        const anchors = [
          [0, 0],
          [1, .08],
          [3, .27],
          [7, .52],
          [14, .75],
          [30, .91],
          [90, 1]
        ];
        const values = [];
        for (let day = 0; day &lt;= days; day++) {
          let a = anchors[0];
          let b = anchors[anchors.length - 1];
          for (let i = 0; i &lt; anchors.length - 1; i++) {
            if (day &gt;= anchors[i][0] &amp;&amp; day &lt;= anchors[i + 1][0]) {
              a = anchors[i];
              b = anchors[i + 1];
              break;
            }
          }
          const ratio = a[1] + ((day - a[0]) / Math.max(1, b[0] - a[0])) * (b[1] - a[1]);
          const rangeScale = days === 90 ? 1 : anchors.find(item =&gt; item[0] === days)?.[1] || .91;
          values.push(Math.round(total * Math.min(1, ratio / rangeScale)));
        }
        return values;
      };

      const renderChart = total =&gt; {
        const values = makeSeries(selectedRange, total);
        const width = 700;
        const height = 270;
        const left = 54;
        const right = 18;
        const top = 24;
        const bottom = 34;
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const max = Math.max(...values) * 1.08;
        const x = index =&gt; left + (index / (values.length - 1)) * plotWidth;
        const y = value =&gt; top + plotHeight - (value / max) * plotHeight;
        const points = values.map((value, index) =&gt; [x(index), y(value)]);
        const linePath = points.map((point, index) =&gt; `${index ? &quot;L&quot; : &quot;M&quot;} ${point[0].toFixed(1)} ${point[1].toFixed(1)}`).join(&quot; &quot;);
        chartLine.setAttribute(&quot;d&quot;, linePath);
        chartArea.setAttribute(&quot;d&quot;, `${linePath} L ${x(values.length - 1).toFixed(1)} ${top + plotHeight} L ${left} ${top + plotHeight} Z`);

        const gridValues = [0, .5, 1];
        chartGrid.innerHTML = gridValues.map(ratio =&gt; {
          const gy = top + plotHeight - ratio * plotHeight;
          const label = formatMetric(max * ratio);
          return `&lt;line class=&quot;grid&quot; x1=&quot;${left}&quot; x2=&quot;${width - right}&quot; y1=&quot;${gy}&quot; y2=&quot;${gy}&quot;&gt;&lt;/line&gt;
            &lt;text class=&quot;axis-label&quot; x=&quot;${left - 9}&quot; y=&quot;${gy + 4}&quot; text-anchor=&quot;end&quot;&gt;${label}&lt;/text&gt;`;
        }).join(&quot;&quot;);

        const ticks = [...new Set([0, Math.min(3, selectedRange), Math.min(7, selectedRange), Math.min(14, selectedRange), selectedRange])];
        chartLabels.innerHTML = ticks.map(day =&gt; `&lt;text class=&quot;axis-label&quot; x=&quot;${x(day)}&quot; y=&quot;${height - 9}&quot; text-anchor=&quot;${day === 0 ? &quot;start&quot; : day === selectedRange ? &quot;end&quot; : &quot;middle&quot;}&quot;&gt;Day ${day}&lt;/text&gt;`).join(&quot;&quot;);

        const milestoneDays = [3, 7, 14, 30, 90].filter(day =&gt; day &lt;= selectedRange);
        chartMilestones.innerHTML = milestoneDays.map(day =&gt; {
          const px = x(day);
          return `&lt;line class=&quot;milestone-line&quot; x1=&quot;${px}&quot; x2=&quot;${px}&quot; y1=&quot;${top}&quot; y2=&quot;${top + plotHeight}&quot;&gt;&lt;/line&gt;
            &lt;text class=&quot;milestone-label&quot; x=&quot;${px + 5}&quot; y=&quot;${top + 13}&quot;&gt;${day}D&lt;/text&gt;`;
        }).join(&quot;&quot;);

        const pointDays = [...new Set([Math.min(3, selectedRange), Math.min(7, selectedRange), Math.min(14, selectedRange), selectedRange])];
        chartPoints.innerHTML = pointDays.map(day =&gt; `&lt;circle class=&quot;total-point&quot; cx=&quot;${x(day)}&quot; cy=&quot;${y(values[day])}&quot; r=&quot;4&quot;&gt;&lt;title&gt;Day ${day}: ${formatMetric(values[day])} views&lt;/title&gt;&lt;/circle&gt;`).join(&quot;&quot;);
      };

      const render = () =&gt; {
        const current = data[selectedPlatform];
        const visibleExternal = externalIncluded ? current.external : 0;
        const visibleTotal = current.owned + visibleExternal;
        const ownedPercent = visibleTotal ? Math.round((current.owned / visibleTotal) * 100) : 0;

        root.dataset.external = String(externalIncluded);
        externalLabel.textContent = externalIncluded ? &quot;Included&quot; : &quot;Excluded&quot;;
        totalViews.textContent = formatMetric(visibleTotal);
        ownedViews.textContent = formatMetric(current.owned);
        ownedShare.textContent = `${ownedPercent}% of visible views`;
        externalViews.textContent = externalIncluded ? formatMetric(current.external) : &quot;—&quot;;
        externalShare.textContent = externalIncluded ? `${100 - ownedPercent}% of visible views · 2 posts` : &quot;Excluded from totals&quot;;
        chartSubtitle.textContent = `${selectedPlatform === &quot;all&quot; ? &quot;Cumulative cross-platform&quot; : selectedPlatform.charAt(0).toUpperCase() + selectedPlatform.slice(1)} views · ${selectedRange} days`;

        platformRows.forEach(row =&gt; {
          row.hidden = selectedPlatform !== &quot;all&quot; &amp;&amp; row.dataset.rowPlatform !== selectedPlatform;
        });

        renderChart(visibleTotal);
      };

      externalToggle.addEventListener(&quot;change&quot;, () =&gt; {
        externalIncluded = externalToggle.checked;
        render();
      });

      tabs.forEach(tab =&gt; {
        tab.addEventListener(&quot;click&quot;, () =&gt; {
          selectedPlatform = tab.dataset.platform;
          tabs.forEach(item =&gt; {
            const active = item === tab;
            item.setAttribute(&quot;aria-selected&quot;, String(active));
            item.classList.toggle(&quot;btn-ghost&quot;, !active);
          });
          render();
        });
      });

      rangeButtons.forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          selectedRange = Number(button.dataset.range);
          rangeButtons.forEach(item =&gt; {
            const active = item === button;
            item.setAttribute(&quot;aria-pressed&quot;, String(active));
            item.classList.toggle(&quot;btn-ghost&quot;, !active);
          });
          render();
        });
      });

      render();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)

    );
    if (described) {
      ids.add(tooltipId);
    } else {

    }

    } else {

    }

    if (openTimeout != null) {

    }

  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();

    if (activeTrigger == null) {
      return;
    }

    tooltip?.remove();

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
